name: Starter checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["24", "26"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm exec --yes --package=pnpm@12.18.0 -- pnpm install --frozen-lockfile --prod=false
      - run: npm exec --yes --package=pnpm@12.18.0 -- pnpm check

  generated-projects:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        preset: [web-saas, ai-worker]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"
      - run: npm exec --yes --package=pnpm@12.18.0 -- pnpm install --frozen-lockfile --prod=false
      - run: npm exec --yes --package=pnpm@12.18.0 -- pnpm build
      - name: Generate, install, verify hooks and check the running app
        run: node tools/smoke-generated.mjs --preset ${{ matrix.preset }}

  remote-dev-box:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
      - run: python -m pip install pyyaml
      - name: Shellcheck the scripts and run the cloud-init install step in ubuntu:24.04
        run: tools/test-remote-dev-box.sh

  offline-exercise:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test legacy installer and offline exercise
        run: python3 -m unittest discover -s tests -v
      - name: Check maintained content and references
        run: python3 tools/check_content.py
