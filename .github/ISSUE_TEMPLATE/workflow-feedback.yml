name: Workflow feedback
description: Share a concrete result from a skill, template or guide.
title: "[Feedback] "
body:
  - type: input
    id: component
    attributes:
      label: Which skill, template, article or setup step did you try?
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task and expected outcome
      description: Use a public or synthetic example; omit private code and credentials.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened, what evidence do you have, and what would improve it?
    validations:
      required: true
